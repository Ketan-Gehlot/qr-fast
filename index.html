<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave us a review</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #4285f4, #34a853); padding: 16px;
  }
  .card {
    background: #fff; border-radius: 18px; padding: 26px 22px; width: 100%; max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 4px; color: #202124; }
  .sub { color: #5f6368; margin: 0 0 14px; font-size: 15px; }
  .stars { font-size: 38px; color: #fbbc04; letter-spacing: 4px; margin-bottom: 10px; }
  textarea {
    width: 100%; min-height: 130px; border: 2px solid #e0e0e0; border-radius: 12px;
    padding: 12px; font-size: 16px; font-family: inherit; resize: vertical; color: #202124;
  }
  textarea:focus { outline: none; border-color: #4285f4; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px; padding: 16px;
    font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 14px;
  }
  .primary { background: #4285f4; color: #fff; }
  .primary:active { background: #3367d6; }
  .link { background: none; color: #4285f4; font-size: 15px; padding: 8px; margin-top: 6px; }
  .steps { text-align: left; font-size: 14px; color: #5f6368; margin: 14px 0 0; padding-left: 20px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #202124; color: #fff; padding: 12px 20px; border-radius: 10px; display: none;
  }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Thank you!</h1>
  <p class="sub">We'd love your feedback on Google</p>
  <div class="stars">★★★★★</div>

  <textarea id="msg" aria-label="Your review"></textarea>

  <button class="btn primary" id="go">Copy &amp; Post on Google</button>
  <button class="btn link" id="shuffle">↻ Show a different message</button>

  <ol class="steps">
    <li>Tap the blue button (your review is copied automatically).</li>
    <li>On Google, tap the <b>5th star</b>.</li>
    <li>Long-press the text box → <b>Paste</b> → <b>Post</b>.</li>
  </ol>
</div>
<div class="toast" id="toast">Review copied! Paste it on Google.</div>

<script src="config.js"></script>
<script>
  const name = CONFIG.BUSINESS_NAME;
  const msgs = CONFIG.MESSAGES.map(m => m.split("{name}").join(name));
  const box = document.getElementById("msg");
  document.getElementById("title").textContent = "Thank you for visiting " + name + "!";

  // Pick a random message, never the same as the last one shown on this phone
  function pick() {
    let last = parseInt(localStorage.getItem("lastMsg") ?? "-1", 10);
    let i;
    do { i = Math.floor(Math.random() * msgs.length); } while (msgs.length > 1 && i === last);
    localStorage.setItem("lastMsg", i);
    box.value = msgs[i];
  }
  pick();

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      box.select(); box.setSelectionRange(0, 99999);
      try { return document.execCommand("copy"); } catch (_) { return false; }
    }
  }

  document.getElementById("shuffle").onclick = pick;
  document.getElementById("go").onclick = async () => {
    await copy(box.value);
    const t = document.getElementById("toast");
    t.style.display = "block";
    setTimeout(() => { window.location.href = CONFIG.REVIEW_URL; }, 900);
  };
</script>
</body>
</html>
